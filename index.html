<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gopali & Co · Renewal Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% -10%, rgba(168,121,47,0.38), transparent 42%),
      radial-gradient(circle at 105% 10%, rgba(79,107,84,0.40), transparent 48%),
      radial-gradient(circle at 50% 120%, rgba(168,67,43,0.22), transparent 55%),
      linear-gradient(160deg, #0F1D28 0%, #1C2B39 45%, #223A47 100%);
    background-attachment: fixed;
    padding: 28px 16px;
  }
  #root { min-height: calc(100vh - 56px); }

  /* ---------- interactive states ---------- */
  .gp-btn { transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease, border-color 0.15s ease; }
  .gp-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(28,43,57,0.18); }
  .gp-btn:active { transform: translateY(0); box-shadow: none; }

  .gp-icon-btn { transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease, border-color 0.15s ease; }
  .gp-icon-btn:hover { border-color: #A8792F !important; color: #A8792F !important; box-shadow: 0 4px 10px rgba(28,43,57,0.12); }

  .gp-stat { transition: transform 0.18s ease, box-shadow 0.18s ease; cursor: default; }
  .gp-stat:hover { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(28,43,57,0.14); z-index: 1; position: relative; }

  .gp-row { transition: background-color 0.15s ease; }
  .gp-row:hover { background-color: #FBF7EE; }

  .gp-input, .gp-select { transition: border-color 0.15s ease, box-shadow 0.15s ease; }
  .gp-input:focus, .gp-select:focus { outline: none; border-color: #A8792F !important; box-shadow: 0 0 0 3px rgba(168,121,47,0.18); }

  .gp-badge-urgent { animation: gp-pulse 2s ease-in-out infinite; }
  @keyframes gp-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(168,67,43,0.35); }
    50% { box-shadow: 0 0 0 5px rgba(168,67,43,0); }
  }

  .gp-link-btn { transition: color 0.15s ease; }
  .gp-link-btn:hover { color: #A8432B !important; }

  .gp-title-icon { animation: gp-spin-in 0.6s ease; }
  @keyframes gp-spin-in {
    from { transform: rotate(-90deg) scale(0.6); opacity: 0; }
    to { transform: rotate(0deg) scale(1); opacity: 1; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

/* ---------- tiny inline icons (no external icon library needed) ---------- */
const Icon = ({ children, size = 14 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"

    {children}
  </svg>
);
const Upload = (p) => <Icon {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" /></Icon>;
const Search = (p) => <Icon {...p}><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></Icon>;
const Copy = (p) => <Icon {...p}><rect x="9" y="9" width="13" height="13" rx="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></Icon>;
const Check = (p) => <Icon {...p}><polyline points="20 6 9 17 4 12" /></Icon>;
const FileDown = (p) => <Icon {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /><path d="M12 18v-6" /><path d="m9 15 3 3 3-3" /></Icon>;
const AlertTriangle = (p) => <Icon {...p}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></Icon>;
const Eye = (p) => <Icon {...p}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" /><circle cx="12" cy="12" r="3" /></Icon>;
const EyeOff = (p) => <Icon {...p}><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a13.16 13.16 0 0 1-1.67 2.68" /><path d="M6.61 6.61A13.526 13.526 0 0 0 1 12s4 8 11 8a9.26 9.26 0 0 0 5.39-1.61" /><line x1="2" y1="2" x2="22" y2="22" /></Icon>;
const RefreshCw = (p) => <Icon {...p}><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" /><path d="M16 16h5v5" /></Icon>;
const Phone = (p) => <Icon {...p}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92Z" /></Icon>;
const MapPin = (p) => <Icon {...p}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></Icon>;
const Mail = (p) => <Icon {...p}><rect x="2" y="4" width="20" height="16" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></Icon>;
const UserPlus = (p) => <Icon {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><line x1="19" y1="8" x2="19" y2="14" /><line x1="16" y1="11" x2="22" y2="11" /></Icon>;
const Download = (p) => <Icon {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></Icon>;
const X = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></Icon>;
const Trash = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></Icon>;

/* ---------- design tokens ---------- */
const INK = "#1C2B39", PAPER = "#FAF6EF", BRASS = "#A8792F", RUST = "#A8432B",
      SAGE = "#4F6B54", SAND = "#EFE7D6", HAIRLINE = "#D8CFB8";

const SAMPLE_CSV = `name,company,phone,location,publication,type,expiry
Rajesh Kumar,Ashok Leyland,+91 98765 43210,"Chennai, Tamil Nadu",Motorindia,Print + Digital,2026-09-08
Priya Textiles,Priya Textiles Ltd,+91 98450 11223,"Coimbatore, Tamil Nadu",The Textile Magazine,Digital,2026-09-15
S. Venkataraman,VST Motors,+91 99401 55667,"Bengaluru, Karnataka",Motorindia,Print,2026-09-28
Meena Fabrics,Meena Fabrics Pvt Ltd,+91 90032 44556,"Surat, Gujarat",The Textile Magazine,Print + Digital,2026-08-20
Karthik Auto Parts,Karthik Auto Components,+91 98844 77123,"Chennai, Tamil Nadu",Motorindia,Digital,2026-10-05
Lakshmi Weaves,Lakshmi Handloom Co,+91 97891 22334,"Erode, Tamil Nadu",The Textile Magazine,Print,2026-10-22
Ashwin R,Ashwin Fleet Services,+91 96332 88991,"Pune, Maharashtra",Motorindia,Print + Digital,2026-09-04
Deepa Textile House,Deepa Textile House,+91 94456 12309,"Mumbai, Maharashtra",The Textile Magazine,Digital,2026-11-10
Vijay Trucking Co,Vijay Logistics,+91 93445 90011,"Delhi",Motorindia,Print,2026-08-30
Ganesh Mills,Ganesh Spinning Mills,+91 92221 33445,"Ludhiana, Punjab",The Textile Magazine,Print + Digital,2026-12-01
Ramesh Auto Traders,Ramesh Auto Traders,+91 91009 22118,"Hyderabad, Telangana",Motorindia,Digital,2026-09-12
Anitha Sarees,Anitha Silks & Sarees,+91 90876 54321,"Kanchipuram, Tamil Nadu",The Textile Magazine,Print,2026-11-25`;

const MAG_MAP = { ME: "Motorindia", TM: "The Textile Magazine", MH: "Motorindia (Hindi)", IH: "IH" };

// PIN required to add a new subscriber. To change it: edit this line, save, and re-upload
// this file to GitHub. It can ONLY be changed here — never from the page itself.
const ADD_SUBSCRIBER_PIN = "1956";
const DISPLAY_CAP = 300;

function parseDate(s) { const d = new Date(s); return isNaN(d) ? null : d; }

function yyyymmToDate(code) {
  if (!code || String(code).trim().length !== 6) return "";
  const s = String(code).trim();
  const year = parseInt(s.slice(0, 4), 10);
  const month = parseInt(s.slice(4, 6), 10);
  if (!year || !month || month < 1 || month > 12) return "";
  const lastDay = new Date(year, month, 0).getDate();
  return `${year}-${String(month).padStart(2, "0")}-${String(lastDay).padStart(2, "0")}`;
}

function daysUntil(dateStr, today) {
  const d = parseDate(dateStr);
  if (!d) return null;
  return Math.ceil((d - today) / (1000 * 60 * 60 * 24));
}

function statusFor(days) {
  if (days === null) return { label: "Unknown", color: "#9A9280", bg: "#F1EDE2" };
  if (days < -30) return { label: "Long overdue", color: "#7A2E1F", bg: "#EAD6CE" };
  if (days < 0) return { label: "Recently overdue", color: RUST, bg: "#F3E2DC" };
  if (days <= 14) return { label: "Urgent", color: RUST, bg: "#F6E7DE" };
  if (days <= 30) return { label: "Due soon", color: BRASS, bg: "#F3E9D4" };
  if (days <= 60) return { label: "Upcoming", color: "#7A6A2E", bg: "#F1EDDD" };
  return { label: "Healthy", color: SAGE, bg: "#E7EEE7" };
}

function fmtDate(dateStr) {
  const d = parseDate(dateStr);
  if (!d) return "—";
  return d.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
}

function normalizeRow(r) {
  const isLegacy = "SUB_ENMON" in r || "sub_cname" in r || "MAGCODE" in r;
  if (isLegacy) {
    const contact = (r.sub_sname || "").trim();
    const company = (r.sub_cname || "").trim();
    const magcode = (r.MAGCODE || "").trim().toUpperCase();
    const city = (r.sub_add4 || "").trim();
    const state = (r.SUB_STATE || "").trim().replace(/^\(|\)$/g, "");
    return {
      name: contact || company || "(no name on file)",
      company,
      phone: (r.sub_telno || "").trim(),
      email: (r.sub_email || "").trim(),
      location: [city, state].filter(Boolean).join(", "),
      publication: MAG_MAP[magcode] || magcode || "Unknown",
      type: [r.SUB_TYPE, r.sub_period ? `${r.sub_period} yr` : ""].filter(Boolean).join(" · ") || "—",
      expiry: yyyymmToDate(r.SUB_ENMON),
      deleted: (r.sub_deleted || "").trim().toUpperCase() === "Y",
      code: (r.sub_code || "").trim(),
    };
  }
  return {
    name: (r.name || "").trim(),
    company: (r.company || "").trim(),
    phone: (r.phone || "").trim(),
    email: (r.email || "").trim(),
    location: (r.location || "").trim(),
    publication: (r.publication || "Other").trim(),
    type: (r.type || "—").trim(),
    expiry: (r.expiry || "").trim(),
    deleted: false,
    code: (r.code || r.subcode || r.sub_code || "").trim(),
  };
}

function RenewalTracker() {
  const [rows, setRows] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [query, setQuery] = useState("");
  const [pubFilter, setPubFilter] = useState("All");
  const [statusFilter, setStatusFilter] = useState("All");
  const [showDeleted, setShowDeleted] = useState(false);
  const [copiedIdx, setCopiedIdx] = useState(null);
  const [error, setError] = useState("");
  const [fileName, setFileName] = useState("");
  const [showAddForm, setShowAddForm] = useState(false);
  const [addError, setAddError] = useState("");
  const [pinUnlocked, setPinUnlocked] = useState(false);
  const [showPinGate, setShowPinGate] = useState(false);
  const [pinInput, setPinInput] = useState("");
  const [pinError, setPinError] = useState("");
  const [pinPurpose, setPinPurpose] = useState("add"); // "add" or "remove"
  const [pendingRemoveId, setPendingRemoveId] = useState(null);
  const emptySub = { name: "", company: "", phone: "", email: "", location: "", publication: "", type: "", expiry: "", code: "" };
  const [newSub, setNewSub] = useState(emptySub);

  const today = useMemo(() => { const d = new Date(); d.setHours(0,0,0,0); return d; }, []);

  const loadCsv = (text, name) => {
    Papa.parse(text, {
      header: true,
      skipEmptyLines: true,
      transformHeader: (h) => h.replace(/^\uFEFF/, "").trim(),
      complete: (res) => {
        const clean = res.data.map(normalizeRow).filter((r) => r.name && r.expiry).map((r, i) => ({ ...r, id: `csv-${Date.now()}-${i}` }));
        if (clean.length === 0) {
          setError(`No valid rows found. Detected columns: ${res.meta && res.meta.fields ? res.meta.fields.join(", ") : "none"}. Expected either name/expiry columns, or the Gopali & Co export columns (sub_cname, SUB_ENMON, MAGCODE, etc.).`);
          return;
        }
        setError("");
        setRows(clean);
        setFileName(name || "");
        setLoaded(true);
      },
      error: () => setError("Couldn't read that file. Please check it's a valid CSV/TXT export."),
    });
  };

  const handleFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => loadCsv(ev.target.result, file.name);
    reader.readAsText(file);
  };

  const loadSample = () => loadCsv(SAMPLE_CSV, "sample data");

  const updateNewSub = (field, value) => setNewSub((prev) => ({ ...prev, [field]: value }));

  const submitNewSub = () => {
    if (!newSub.name.trim()) { setAddError("Name is required."); return; }
    if (!newSub.expiry.trim()) { setAddError("Expiry date is required."); return; }
    const row = normalizeRow({
      name: newSub.name.trim(),
      company: newSub.company.trim(),
      phone: newSub.phone.trim(),
      email: newSub.email.trim(),
      location: newSub.location.trim(),
      publication: newSub.publication.trim() || "Other",
      type: newSub.type.trim() || "—",
      expiry: newSub.expiry,
      code: newSub.code.trim(),
    });
    setRows((prev) => [...prev, { ...row, id: `manual-${Date.now()}` }]);
    setNewSub(emptySub);
    setAddError("");
    setShowAddForm(false);
    setLoaded(true);
    if (!fileName) setFileName("manually added subscribers");
  };

  const cancelAddForm = () => { setNewSub(emptySub); setAddError(""); setShowAddForm(false); };

  const requestAddSubscriber = () => {
    if (pinUnlocked) { setShowAddForm((v) => !v); return; }
    setPinPurpose("add");
    setPinInput("");
    setPinError("");
    setShowPinGate(true);
  };

  const removeSubscriber = (id) => {
    setRows((prev) => prev.filter((r) => r.id !== id));
  };

  const requestRemoveSubscriber = (r) => {
    if (pinUnlocked) {
      if (window.confirm(`Remove ${r.company || r.name} from the list? This can't be undone (unless you re-upload the original CSV).`)) {
        removeSubscriber(r.id);
      }
      return;
    }
    setPinPurpose("remove");
    setPendingRemoveId(r.id);
    setPinInput("");
    setPinError("");
    setShowPinGate(true);
  };

  const submitPin = () => {
    if (pinInput.trim() === ADD_SUBSCRIBER_PIN) {
      setPinUnlocked(true);
      setShowPinGate(false);
      setPinInput("");
      setPinError("");
      if (pinPurpose === "add") {
        setShowAddForm(true);
      } else if (pinPurpose === "remove" && pendingRemoveId) {
        const target = rows.find((r) => r.id === pendingRemoveId);
        if (target && window.confirm(`Remove ${target.company || target.name} from the list? This can't be undone (unless you re-upload the original CSV).`)) {
          removeSubscriber(pendingRemoveId);
        }
        setPendingRemoveId(null);
      }
    } else {
      setPinError("Incorrect PIN.");
    }
  };

  const cancelPinGate = () => { setShowPinGate(false); setPinInput(""); setPinError(""); setPendingRemoveId(null); };

  const exportRows = () => visible.map((r) => ({
    "Subscriber Code": r.code || "",
    "Name": r.name || "",
    "Company": r.company || "",
    "Phone": r.phone || "",
    "Email": r.email || "",
    "Location": r.location || "",
    "Publication": r.publication || "",
    "Type": r.type || "",
    "Expiry": r.expiry || "",
    "Status": r.status.label,
    "Days Remaining": r.days === null ? "" : r.days,
  }));

  const triggerDownload = (blob, filename) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const downloadCsv = () => {
    const csv = Papa.unparse(exportRows());
    triggerDownload(new Blob([csv], { type: "text/csv;charset=utf-8;" }), `gopali-subscribers-${today.toISOString().slice(0, 10)}.csv`);
  };

  const downloadExcel = () => {
    const ws = XLSX.utils.json_to_sheet(exportRows());
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Subscribers");
    XLSX.writeFile(wb, `gopali-subscribers-${today.toISOString().slice(0, 10)}.xlsx`);
  };

  const enriched = useMemo(() => rows.map((r) => {
    const days = daysUntil(r.expiry, today);
    return { ...r, days, status: statusFor(days) };
  }), [rows, today]);

  const visible = useMemo(() => enriched.filter((r) => showDeleted || !r.deleted), [enriched, showDeleted]);

  const publications = useMemo(() => {
    const set = new Set(visible.map((r) => r.publication));
    return ["All", ...Array.from(set).sort()];
  }, [visible]);

  const statusOptions = ["All", "Recently overdue", "Long overdue", "Urgent", "Due soon", "Upcoming", "Healthy"];

  const filtered = useMemo(() => {
    return visible
      .filter((r) => (pubFilter === "All" ? true : r.publication === pubFilter))
      .filter((r) => (statusFilter === "All" ? true : r.status.label === statusFilter))
      .filter((r) => {
        if (!query.trim()) return true;
        const q = query.toLowerCase();
        return r.name.toLowerCase().includes(q) || r.company.toLowerCase().includes(q) || (r.code || "").toLowerCase().includes(q);
      })
      .sort((a, b) => (a.days ?? 9999) - (b.days ?? 9999));
  }, [visible, pubFilter, statusFilter, query]);

  const displayRows = filtered.slice(0, DISPLAY_CAP);

  const stats = useMemo(() => {
    const recentOverdue = visible.filter((r) => r.days !== null && r.days >= -30 && r.days < 0).length;
    const longOverdue = visible.filter((r) => r.days !== null && r.days < -30).length;
    const d30 = visible.filter((r) => r.days !== null && r.days >= 0 && r.days <= 30).length;
    const d60 = visible.filter((r) => r.days !== null && r.days > 30 && r.days <= 60).length;
    const healthy = visible.filter((r) => r.days !== null && r.days > 60).length;
    return { total: visible.length, recentOverdue, longOverdue, d30, d60, healthy };
  }, [visible]);

  const deletedCount = enriched.length - visible.length;

  const reminderText = (r) => {
    const companyLine = r.company || r.name;
    return `Dear ${companyLine},

This is a reminder from Gopali & Co that your subscription to ${r.publication} ${r.days < 0 ? `lapsed on ${fmtDate(r.expiry)}` : `is due to expire on ${fmtDate(r.expiry)}`}.

To continue receiving your issues without interruption, please renew at your earliest convenience. Reply to this message and our team will assist with the renewal.

Thank you for your continued readership.

Gopali & Co
Subscriptions Desk`;
  };

  const copyReminder = (r, idx) => {
    navigator.clipboard.writeText(reminderText(r)).then(() => {
      setCopiedIdx(idx);
      setTimeout(() => setCopiedIdx(null), 1500);
    });
  };

  const mailtoLink = (r) => {
    const subject = encodeURIComponent(`${r.publication} subscription — ${r.days < 0 ? "renewal overdue" : "renewal reminder"}`);
    const body = encodeURIComponent(reminderText(r));
    return `mailto:${r.email}?subject=${subject}&body=${body}`;
  };

  return (
    <div style={{ background: PAPER, minHeight: "auto", maxWidth: "1180px", margin: "0 auto", borderRadius: "14px", boxShadow: "0 30px 70px rgba(10,20,30,0.45), 0 2px 0 rgba(255,255,255,0.4) inset", overflow: "hidden", fontFamily: "'Inter', sans-serif", color: INK }}>
      <div style={{ borderBottom: `3px solid ${INK}`, padding: "28px 28px 18px", background: `linear-gradient(135deg, ${SAND} 0%, ${PAPER} 60%)` }}>
        <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", flexWrap: "wrap", gap: "8px" }}>
          <div>
            <div style={{ fontSize: "12px", letterSpacing: "0.12em", color: BRASS, fontWeight: 600 }}>GOPALI &amp; CO &nbsp;·&nbsp; SUBSCRIPTIONS DESK</div>
            <h1 style={{ fontFamily: "'Source Serif 4', serif", fontWeight: 700, fontSize: "34px", margin: "4px 0 0", color: INK, display: "flex", alignItems: "center", gap: "10px" }}>
              <span className="gp-title-icon" style={{ display: "inline-flex", color: BRASS }}><RefreshCw size={26} /></span>
              Renewal Tracker
            </h1>
          </div>
          <div style={{ fontSize: "13px", color: "#6B6252", fontFamily: "'Source Serif 4', serif", fontStyle: "italic" }}>
            {today.toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" })}
          </div>
        </div>
      </div>

      <div style={{ padding: "24px 28px 40px", maxWidth: "1100px", margin: "0 auto" }}>
        {!loaded ? (
          <div style={{ border: `1px dashed ${HAIRLINE}`, borderRadius: "4px", padding: "48px 24px", textAlign: "center", background: "#fff" }}>
            <p style={{ fontFamily: "'Source Serif 4', serif", fontSize: "18px", marginBottom: "6px" }}>Load your subscriber list to begin</p>
            <p style={{ fontSize: "13px", color: "#6B6252", marginBottom: "22px" }}>
              Works with a simple name/expiry CSV, or a direct export from the Access database (sub_cname, SUB_ENMON, MAGCODE, etc.)
            </p>
            <div style={{ display: "flex", gap: "12px", justifyContent: "center", flexWrap: "wrap" }}>
              <label className="gp-btn" style={{ display: "inline-flex", alignItems: "center", gap: "8px", background: INK, color: PAPER, padding: "10px 18px", borderRadius: "3px", fontSize: "13px", fontWeight: 600, cursor: "pointer" }}>
                <Upload size={15} /> Upload CSV / TXT
                <input type="file" accept=".csv,.txt" onChange={handleFile} style={{ display: "none" }} />
              </label>
              <button onClick={loadSample} className="gp-btn" style={{ display: "inline-flex", alignItems: "center", gap: "8px", background: "transparent", color: INK, border: `1px solid ${INK}`, padding: "10px 18px", borderRadius: "3px", fontSize: "13px", fontWeight: 600, cursor: "pointer" }}>
                <FileDown size={15} /> Try sample data
              </button>
              <button onClick={() => { setLoaded(true); requestAddSubscriber(); }} className="gp-btn" style={{ display: "inline-flex", alignItems: "center", gap: "8px", background: "transparent", color: INK, border: `1px solid ${INK}`, padding: "10px 18px", borderRadius: "3px", fontSize: "13px", fontWeight: 600, cursor: "pointer" }}>
                <UserPlus size={15} /> Add subscriber manually
              </button>
            </div>
            {error && (
              <p style={{ color: RUST, fontSize: "13px", marginTop: "16px", display: "flex", gap: "6px", justifyContent: "center", alignItems: "center" }}>
                <AlertTriangle size={14} /> {error}
              </p>
            )}
          </div>
        ) : (
          <>
            {fileName && (
              <p style={{ fontSize: "11.5px", color: "#9A9280", marginBottom: "10px" }}>
                Loaded: {fileName} &middot; {enriched.length.toLocaleString("en-IN")} total records
                {deletedCount > 0 && !showDeleted ? ` (${deletedCount.toLocaleString("en-IN")} cancelled records hidden)` : ""}
              </p>
            )}

            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: "1px", background: HAIRLINE, border: `1px solid ${HAIRLINE}`, marginBottom: "16px" }}>
              {[
                { label: "On file (not cancelled)", value: stats.total, color: INK },
                { label: "Recently overdue (30 days)", value: stats.recentOverdue, color: RUST },
                { label: "Long overdue", value: stats.longOverdue, color: "#7A2E1F" },
                { label: "Due within 30 days", value: stats.d30, color: BRASS },
                { label: "Due in 31–60 days", value: stats.d60, color: "#7A6A2E" },
                { label: "Healthy (60+ days)", value: stats.healthy, color: SAGE },
              ].map((s) => (
                <div key={s.label} className="gp-stat" style={{ background: "#fff", padding: "16px 14px" }}>
                  <div style={{ fontFamily: "'Source Serif 4', serif", fontSize: "26px", fontWeight: 700, color: s.color }}>{s.value.toLocaleString("en-IN")}</div>
                  <div style={{ fontSize: "11.5px", color: "#6B6252", marginTop: "2px" }}>{s.label}</div>
                </div>
              ))}
            </div>

            <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", marginBottom: "14px", alignItems: "center" }}>
              <button onClick={requestAddSubscriber} className="gp-btn" style={{ display: "inline-flex", alignItems: "center", gap: "7px", background: INK, color: PAPER, border: "none", padding: "9px 14px", borderRadius: "3px", fontSize: "12.5px", fontWeight: 600, cursor: "pointer" }}>
                <UserPlus size={14} /> Add subscriber
              </button>
              <button onClick={downloadCsv} className="gp-btn" style={{ display: "inline-flex", alignItems: "center", gap: "7px", background: "#fff", color: INK, border: `1px solid ${HAIRLINE}`, padding: "9px 14px", borderRadius: "3px", fontSize: "12.5px", fontWeight: 600, cursor: "pointer" }}>
                <Download size={14} /> Download CSV
              </button>
              <button onClick={downloadExcel} className="gp-btn" style={{ display: "inline-flex", alignItems: "center", gap: "7px", background: "#fff", color: INK, border: `1px solid ${HAIRLINE}`, padding: "9px 14px", borderRadius: "3px", fontSize: "12.5px", fontWeight: 600, cursor: "pointer" }}>
                <Download size={14} /> Download Excel
              </button>
            </div>

            {showPinGate && (
              <div style={{ border: `1px solid ${HAIRLINE}`, borderRadius: "4px", background: "#fff", padding: "18px 20px", marginBottom: "18px", maxWidth: "320px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "10px" }}>
                  <div style={{ fontFamily: "'Source Serif 4', serif", fontSize: "15px", fontWeight: 700 }}>
                    {pinPurpose === "remove" ? "Enter PIN to remove subscriber" : "Enter PIN to add subscriber"}
                  </div>
                  <button onClick={cancelPinGate} style={{ background: "none", border: "none", cursor: "pointer", color: "#9A9280", padding: "4px" }}><X size={15} /></button>
                </div>
                <input
                  type="password"
                  inputMode="numeric"
                  maxLength={4}
                  value={pinInput}
                  onChange={(e) => setPinInput(e.target.value.replace(/\D/g, ""))}
                  onKeyDown={(e) => { if (e.key === "Enter") submitPin(); }}
                  placeholder="4-digit PIN"
                  autoFocus
                  className="gp-input"
                  style={{ width: "100%", padding: "9px 10px", border: `1px solid ${HAIRLINE}`, borderRadius: "3px", fontSize: "16px", letterSpacing: "0.3em", textAlign: "center", marginBottom: "10px" }}
                />
                {pinError && <p style={{ color: RUST, fontSize: "12.5px", marginBottom: "10px" }}>{pinError}</p>}
                <button onClick={submitPin} className="gp-btn" style={{ width: "100%", background: INK, color: PAPER, border: "none", padding: "9px 18px", borderRadius: "3px", fontSize: "13px", fontWeight: 600, cursor: "pointer" }}>
                  Unlock
                </button>
              </div>
            )}

            {showAddForm && (
              <div style={{ border: `1px solid ${HAIRLINE}`, borderRadius: "4px", background: "#fff", padding: "18px 20px", marginBottom: "18px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "14px" }}>
                  <div style={{ fontFamily: "'Source Serif 4', serif", fontSize: "16px", fontWeight: 700 }}>Add a new subscriber</div>
                  <button onClick={cancelAddForm} style={{ background: "none", border: "none", cursor: "pointer", color: "#9A9280", padding: "4px" }}><X size={16} /></button>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: "10px", marginBottom: "10px" }}>
                  <input value={newSub.name} onChange={(e) => updateNewSub("name", e.target.value)} placeholder="Name *" className="gp-input"
                    style={{ padding: "9px 10px", border: `1px solid ${HAIRLINE}`, borderRadius: "3px", fontSize: "13px" }} />
                  <input value={newSub.company} onChange={(e) => updateNewSub("company", e.target.value)} placeholder="Company" className="gp-input"
                    style={{ padding: "9px 10px", border: `1px solid ${HAIRLINE}`, borderRadius: "3px", fontSize: "13px" }} />
                  <input value={newSub.code} onChange={(e) => updateNewSub("code", e.target.value)} placeholder="Subscriber code" className="gp-input"
                    style={{ padding: "9px 10px", border: `1px solid ${HAIRLINE}`, borderRadius: "3px", fontSize: "13px" }} />
                  <input value={newSub.phone} onChange={(e) => updateNewSub("phone", e.target.value)} placeholder="Phone" className="gp-input"
                    style={{ padding: "9px 10px", border: `1px solid ${HAIRLINE}`, borderRadius: "3px", fontSize: "13px" }} />
                  <input value={newSub.email} onChange={(e) => updateNewSub("email", e.target.value)} placeholder="Email" className="gp-input"
                    style={{ padding: "9px 10px", border: `1px solid ${HAIRLINE}`, borderRadius: "3px", fontSize: "13px" }} />
                  <input value={newSub.location} onChange={(e) => updateNewSub("location", e.target.value)} placeholder="Location (city, state)" className="gp-input"
                    style={{ padding: "9px 10px", border: `1px solid ${HAIRLINE}`, borderRadius: "3px", fontSize: "13px" }} />
                  <input value={newSub.publication} onChange={(e) => updateNewSub("publication", e.target.value)} placeholder="Publication" list="pub-suggestions" className="gp-input"
                    style={{ padding: "9px 10px", border: `1px solid ${HAIRLINE}`, borderRadius: "3px", fontSize: "13px" }} />
                  <datalist id="pub-suggestions">
                    <option value="Motorindia" /><option value="The Textile Magazine" /><option value="Motorindia (Hindi)" />
                  </datalist>
                  <input value={newSub.type} onChange={(e) => updateNewSub("type", e.target.value)} placeholder="Type (e.g. Print + Digital)" className="gp-input"
                    style={{ padding: "9px 10px", border: `1px solid ${HAIRLINE}`, borderRadius: "3px", fontSize: "13px" }} />
                  <input type="date" value={newSub.expiry} onChange={(e) => updateNewSub("expiry", e.target.value)} className="gp-input"
                    style={{ padding: "9px 10px", border: `1px solid ${HAIRLINE}`, borderRadius: "3px", fontSize: "13px" }} />
                </div>
                {addError && <p style={{ color: RUST, fontSize: "12.5px", marginBottom: "10px" }}>{addError}</p>}
                <div style={{ display: "flex", gap: "10px" }}>
                  <button onClick={submitNewSub} className="gp-btn" style={{ background: INK, color: PAPER, border: "none", padding: "9px 18px", borderRadius: "3px", fontSize: "13px", fontWeight: 600, cursor: "pointer" }}>
                    Save subscriber
                  </button>
                  <button onClick={cancelAddForm} className="gp-btn" style={{ background: "transparent", color: INK, border: `1px solid ${HAIRLINE}`, padding: "9px 18px", borderRadius: "3px", fontSize: "13px", fontWeight: 600, cursor: "pointer" }}>
                    Cancel
                  </button>
                </div>
              </div>
            )}

            {stats.recentOverdue > 0 && statusFilter !== "Recently overdue" && (
              <button onClick={() => setStatusFilter("Recently overdue")} className="gp-btn" style={{ fontSize: "12px", color: RUST, background: "#F3E2DC", border: "none", borderRadius: "3px", padding: "7px 12px", cursor: "pointer", fontWeight: 600, marginBottom: "16px" }}>
                Jump to the {stats.recentOverdue.toLocaleString("en-IN")} subscribers overdue in the last 30 days →
              </button>
            )}

            <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", marginBottom: "10px", alignItems: "center" }}>
              <div style={{ position: "relative", flex: "1 1 220px" }}>
                <span style={{ position: "absolute", left: "10px", top: "50%", transform: "translateY(-50%)", color: "#9A9280" }}><Search size={14} /></span>
                <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search name, company or subscriber code" className="gp-input"
                  style={{ width: "100%", padding: "9px 10px 9px 32px", border: `1px solid ${HAIRLINE}`, borderRadius: "3px", fontSize: "13px", background: "#fff", outline: "none" }} />
              </div>
              <select value={pubFilter} onChange={(e) => setPubFilter(e.target.value)} className="gp-select" style={{ padding: "9px 10px", border: `1px solid ${HAIRLINE}`, borderRadius: "3px", fontSize: "13px", background: "#fff" }}>
                {publications.map((p) => <option key={p} value={p}>{p === "All" ? "All publications" : p}</option>)}
              </select>
              <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} className="gp-select" style={{ padding: "9px 10px", border: `1px solid ${HAIRLINE}`, borderRadius: "3px", fontSize: "13px", background: "#fff" }}>
                {statusOptions.map((s) => <option key={s} value={s}>{s === "All" ? "All statuses" : s}</option>)}
              </select>
              <button onClick={() => { setRows([]); setLoaded(false); setQuery(""); setPubFilter("All"); setStatusFilter("All"); }} className="gp-link-btn"
                style={{ fontSize: "12px", color: "#6B6252", background: "none", border: "none", cursor: "pointer", textDecoration: "underline" }}>
                Load a different file
              </button>
            </div>

            {deletedCount > 0 && (
              <button onClick={() => setShowDeleted((v) => !v)} className="gp-link-btn" style={{ display: "inline-flex", alignItems: "center", gap: "6px", fontSize: "12px", color: "#6B6252", background: "none", border: "none", cursor: "pointer", marginBottom: "14px", padding: 0 }}>
                {showDeleted ? <EyeOff size={13} /> : <Eye size={13} />}
                {showDeleted ? `Hide ${deletedCount.toLocaleString("en-IN")} cancelled records` : `Show ${deletedCount.toLocaleString("en-IN")} cancelled records too`}
              </button>
            )}

            <div style={{ border: `1px solid ${HAIRLINE}`, borderRadius: "4px", overflow: "hidden", background: "#fff" }}>
              <div style={{ display: "grid", gridTemplateColumns: "1.8fr 1fr 1fr 0.9fr 1.2fr", padding: "10px 16px", background: SAND, fontSize: "11px", fontWeight: 600, letterSpacing: "0.04em", color: "#6B6252", textTransform: "uppercase" }}>
                <div>Subscriber</div><div>Publication</div><div>Expiry</div><div>Status</div><div style={{ textAlign: "right" }}>Reminder</div>
              </div>
              {displayRows.length === 0 ? (
                <div style={{ padding: "32px", textAlign: "center", color: "#9A9280", fontSize: "13px" }}>No subscribers match this filter.</div>
              ) : (
                displayRows.map((r, idx) => (
                  <div key={idx} className="gp-row" style={{ display: "grid", gridTemplateColumns: "1.8fr 1fr 1fr 0.9fr 1.2fr", padding: "14px 16px", borderTop: `1px solid ${HAIRLINE}`, alignItems: "center", fontSize: "13px" }}>
                    <div>
                      {r.code && <div style={{ fontWeight: 700, fontSize: "13.5px", color: INK }}>{r.code}</div>}
                      <div style={{ fontWeight: r.code ? 500 : 600, fontSize: r.code ? "12.5px" : "13px", color: r.code ? "#6B6252" : INK, marginTop: r.code ? "2px" : 0 }}>{r.company || r.name}</div>
                      {r.company && <div style={{ fontSize: "11.5px", color: "#9A9280" }}>{r.name}</div>}
                      <div style={{ fontSize: "11.5px", color: "#9A9280", marginTop: "2px", display: "flex", alignItems: "center", gap: "10px", flexWrap: "wrap" }}>
                        {r.location && <span style={{ display: "inline-flex", alignItems: "center", gap: "4px" }}><MapPin size={11} />{r.location}</span>}
                        {r.phone && <span style={{ display: "inline-flex", alignItems: "center", gap: "4px" }}><Phone size={11} />{r.phone}</span>}
                        {!r.location && !r.phone && "no location/phone on file"}
                      </div>
                      <div style={{ fontSize: "11.5px", color: r.email ? "#3A5A7A" : "#C4BCA6", marginTop: "2px", wordBreak: "break-all", display: "flex", alignItems: "center", gap: "4px" }}>
                        {r.email && <Mail size={11} />} {r.email || "no email on file"}
                      </div>
                    </div>
                    <div>{r.publication}</div>
                    <div>{fmtDate(r.expiry)}</div>
                    <div>
                      <span className={r.status.label === "Urgent" || r.status.label === "Recently overdue" || r.status.label === "Long overdue" ? "gp-badge-urgent" : ""}
                        style={{ fontSize: "11px", fontWeight: 600, padding: "3px 9px", borderRadius: "12px", background: r.status.bg, color: r.status.color, display: "inline-block" }}>
                        {r.status.label}
                      </span>
                    </div>
                    <div style={{ textAlign: "right", display: "flex", gap: "6px", justifyContent: "flex-end", flexWrap: "wrap" }}>
                      <button onClick={() => copyReminder(r, idx)} title="Copy reminder message" className="gp-icon-btn"
                        style={{ display: "inline-flex", alignItems: "center", gap: "5px", fontSize: "12px", padding: "6px 8px", borderRadius: "3px", border: `1px solid ${HAIRLINE}`, background: copiedIdx === idx ? "#E7EEE7" : "#fff", color: copiedIdx === idx ? SAGE : INK, cursor: "pointer" }}>
                        {copiedIdx === idx ? <Check size={13} /> : <Copy size={13} />}
                      </button>
                      {r.email && (
                        <a href={mailtoLink(r)} title="Open a pre-filled reminder email" className="gp-icon-btn"
                          style={{ display: "inline-flex", alignItems: "center", gap: "5px", fontSize: "12px", padding: "6px 8px", borderRadius: "3px", border: `1px solid ${HAIRLINE}`, background: "#fff", color: INK, textDecoration: "none" }}>
                          <Mail size={12} /> Email
                        </a>
                      )}
                      <button onClick={() => requestRemoveSubscriber(r)} title="Remove subscriber (PIN required)" className="gp-icon-btn"
                        style={{ display: "inline-flex", alignItems: "center", gap: "5px", fontSize: "12px", padding: "6px 8px", borderRadius: "3px", border: `1px solid ${HAIRLINE}`, background: "#fff", color: RUST, cursor: "pointer" }}>
                        <Trash size={13} />
                      </button>
                    </div>
                  </div>
                ))
              )}
            </div>

            <p style={{ fontSize: "11.5px", color: "#9A9280", marginTop: "14px" }}>
              {filtered.length > DISPLAY_CAP ? `Showing the ${DISPLAY_CAP} soonest-expiring of ${filtered.length.toLocaleString("en-IN")} matching records — narrow your search or filters to see others. ` : ""}
              Data stays on this computer only — nothing is uploaded anywhere. Manually added subscribers and any edits exist only in this browser tab until you download a CSV/Excel copy. Reload the page to clear it.
            </p>
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<RenewalTracker />);
</script>
</body>
</html>
