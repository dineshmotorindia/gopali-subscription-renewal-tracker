const Icon = ({ children, size = 15, style }) => (
  <span style={{ display: "inline-flex", width: size, height: size, alignItems: "center", justifyContent: "center", ...style }}>

function buildPrompt(sourceText, publication) {
  return `You are a social media content assistant for ${publication}, a B2B trade magazine published by Gopali & Co (${
    publication === "Motorindia"
      ? "India's leading B2B magazine on the commercial vehicle and automotive industry, audience includes fleet operators, OEMs, component suppliers, and industry executives"
      : "a leading B2B magazine on the Indian textile industry, audience includes mill owners, manufacturers, and textile industry executives"
  }).

Respond with ONLY a raw JSON object (no markdown fences, no preamble) with exactly these four keys:
- "linkedin": a LinkedIn post, 80-150 words, professional tone, ending with 3-5 relevant hashtags
- "instagram": an Instagram caption, 40-80 words, slightly more engaging but still professional, ending with 5-8 relevant hashtags
- "whatsapp": a short WhatsApp broadcast message, 2-3 sentences, direct, with a clear call to action to read more
- "newsletter": a 2-3 sentence teaser for an email newsletter, ending with an implied "read more"

Source content:
"""
${sourceText}
"""`;

/* Low-opacity backdrop motifs — gear ring for Motorindia, warp/weft grid for Textile.
   Rendered as layered CSS, cross-faded on publication switch (the one deliberate
   page-level motion moment). */
function Backdrop({ theme }) {
  const gearOpacity = theme.patternGear ? 1 : 0;
  const weaveOpacity = theme.patternGear ? 0 : 1;

        backgroundImage: `repeating-conic-gradient(${theme.key === "motorindia" ? theme.secondary : THEMES.Motorindia.secondary} 0deg 4deg, transparent 4deg 18deg)`,
        borderRadius: "50%",
        WebkitMaskImage: "radial-gradient(circle, black 60%, transparent 72%)",
        maskImage: "radial-gradient(circle, black 60%, transparent 72%)",
      }} />
      <div style={{
        position: "absolute", inset: 0,
        opacity: weaveOpacity * 0.45, transition: "opacity 900ms ease",
        backgroundImage: `
          repeating-linear-gradient(90deg, ${THEMES["The Textile Magazine"].secondary}22 0px, ${THEMES["The Textile Magazine"].secondary}22 2px, transparent 2px, transparent 26px),
          repeating-linear-gradient(0deg, ${THEMES["The Textile Magazine"].secondary}22 0px, ${THEMES["The Textile Magazine"].secondary}22 2px, transparent 2px, transparent 26px)
        `,
      }} />
    </div>
  );
}

function PublicationCard({ pub, theme, active, onSelect }) {
  return (
    <button
      onClick={() => onSelect(pub)}
      aria-pressed={active}
      style={{
        position: "relative",
        flex: "1 1 260px",
        maxWidth: 340,
        cursor: active ? "default" : "pointer",
        background: "#fff",
        border: `1px solid ${active ? theme.secondary : HAIRLINE}`,
        borderBottom: `5px solid ${active ? theme.secondary : HAIRLINE}`,
        borderRadius: "3px",
        padding: "22px 20px 16px",
        textAlign: "left",
        transform: active ? "translateY(-4px)" : "translateY(0)",
        boxShadow: active ? "0 14px 26px -18px rgba(20,15,5,0.45)" : "0 2px 0 rgba(20,15,5,0.02)",
        filter: active ? "none" : "grayscale(0.35) opacity(0.72)",
        transition: "transform 260ms ease, box-shadow 260ms ease, filter 260ms ease, border-color 260ms ease",
      }}
    >
      <div style={{
        fontFamily: "'JetBrains Mono', monospace", fontSize: "10.5px", letterSpacing: "0.06em",
        color: active ? theme.secondaryDark : "#9A9280", marginBottom: "10px",
      }}>
        {active ? "ON DESK" : "SELECT DESK"}
      </div>
      <img src={theme.logo} alt={theme.logoAlt} style={{ width: "100%", maxWidth: 220, height: "auto", display: "block", marginBottom: "10px" }} />
      <div style={{ fontSize: "12px", color: INKSOFT, fontStyle: "italic", fontFamily: "'Source Serif 4', serif" }}>
        {theme.beat}
      </div>
    </button>
  );
}

function ContentRepurposer() {
  const [sourceText, setSourceText] = useState("");
  const [publication, setPublication] = useState("Motorindia");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [results, setResults] = useState(null);
  const [copiedKey, setCopiedKey] = useState(null);

  const [apiKey, setApiKey] = useState("");
  const [showSettings, setShowSettings] = useState(false);
  const [keyInput, setKeyInput] = useState("");

  const theme = useMemo(() => THEMES[publication], [publication]);

  useEffect(() => {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) setApiKey(saved);
    else setShowSettings(true);
  }, []);

  const saveKey = () => {
    const trimmed = keyInput.trim();
    if (!trimmed) return;
    localStorage.setItem(STORAGE_KEY, trimmed);
    setApiKey(trimmed);
    setKeyInput("");
    setShowSettings(false);
  };

  const clearKey = () => {
    localStorage.removeItem(STORAGE_KEY);
    setApiKey("");
    setShowSettings(true);
  };

  const isBareUrl = (text) => /^https?:\/\/\S+$/i.test(text.trim());

  const generate = async () => {
    if (!sourceText.trim()) return;
    if (!apiKey) {
      setError("Add the team's Anthropic API key first (gear icon, top right) — needed once only.");
      setShowSettings(true);
      return;
    }
    if (isBareUrl(sourceText)) {
      setError("That looks like just a link — please paste the actual article text instead. This tool can't visit URLs on its own.");
      return;
    }
    setLoading(true);
    setError("");
    setResults(null);
    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [{ role: "user", content: buildPrompt(sourceText, publication) }],
        }),
      });
      if (!response.ok) {
        const errBody = await response.text();
        if (response.status === 401) throw new Error("Invalid API key — check it via the gear icon.");
        throw new Error(`API error (${response.status}): ${errBody.slice(0, 150)}`);
      }
      const data = await response.json();
      const text = (data.content || []).map((b) => b.text || "").join("\n").trim();
      const firstBrace = text.indexOf("{");
      const lastBrace = text.lastIndexOf("}");
      if (firstBrace === -1 || lastBrace === -1) throw new Error("No JSON found in response");
      const clean = text.slice(firstBrace, lastBrace + 1);
      const parsed = JSON.parse(clean);
      if (!parsed.linkedin && !parsed.instagram && !parsed.whatsapp && !parsed.newsletter) {
        throw new Error("Response missing expected fields");
      }
      setResults(parsed);
    } catch (e) {
      setError(e.message && e.message.includes("API") ? e.message : "Something went wrong generating content — try pasting a fuller paragraph of the actual article text, then generate again.");
    } finally {
      setLoading(false);
    }
  };

  const copyText = (key, text) => {
    navigator.clipboard.writeText(text).then(() => {
      setCopiedKey(key);
      setTimeout(() => setCopiedKey(null), 1500);
    });
  };

  const wordCount = sourceText.trim() ? sourceText.trim().split(/\s+/).length : 0;

  return (
    <div style={{ position: "relative", background: PAPER, minHeight: "100vh", fontFamily: "'Inter', sans-serif", color: INK }}>
      <style>{FONT_IMPORT}</style>
      <style>{`
        .spin { animation: spin 1s linear infinite; display:inline-block; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .result-card { animation: riseIn 380ms ease both; }
        textarea::placeholder { color: #ADA48F; }
        .gen-btn:not(:disabled):hover { filter: brightness(1.08); }
        .pub-select:focus-visible { outline-offset: 3px; }
      `}</style>

      <Backdrop theme={theme} />

      <div style={{ position: "relative", zIndex: 1, borderBottom: `3px solid ${INK}`, padding: "26px 28px 20px", background: `linear-gradient(${PAPER}, ${PAPER}), ${PAPER}` }}>
        <button
          onClick={() => setShowSettings((s) => !s)}
          title="API key settings"
          style={{ position: "absolute", top: "22px", right: "28px", background: "#fff", border: `1px solid ${HAIRLINE}`, borderRadius: "4px", padding: "8px 10px", cursor: "pointer", fontSize: "15px", color: INK }}
        >
          <GearIcon size={16} />
        </button>
        <div style={{ display: "flex", alignItems: "baseline", gap: "10px", flexWrap: "wrap" }}>
          <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: "11px", letterSpacing: "0.08em", color: PRESSRED, fontWeight: 500 }}>
            GOPALI &amp; CO
          </span>
          <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: "11px", letterSpacing: "0.04em", color: "#9A9280" }}>
            wire desk
          </span>
        </div>
        <h1 style={{ fontFamily: "'Source Serif 4', serif", fontWeight: 700, fontSize: "36px", margin: "6px 0 0", lineHeight: 1.05 }}>
          Content Repurposer
        </h1>
        <p style={{ fontSize: "13px", color: INKSOFT, marginTop: "8px", fontStyle: "italic", fontFamily: "'Source Serif 4', serif", maxWidth: 560 }}>
          File one story, walk away with four — reshaped for LinkedIn, Instagram, WhatsApp, and the newsletter, in the desk's own voice.
        </p>
      </div>

      <div style={{ position: "relative", zIndex: 1, padding: "24px 28px 40px", maxWidth: 800, margin: "0 auto" }}>

        {showSettings && (
          <div style={{ background: "#fff", border: `1px solid ${HAIRLINE}`, borderRadius: "4px", padding: "16px 18px", marginBottom: "20px" }}>
            <div style={{ fontWeight: 600, fontSize: "13.5px", marginBottom: "6px" }}>Anthropic API key (one-time setup)</div>
            <p style={{ fontSize: "12px", color: INKSOFT, marginTop: 0, marginBottom: "10px", lineHeight: 1.5 }}>
              Stored only in this browser — never sent anywhere except Anthropic's API. Get a key at{" "}
              <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noreferrer" style={{ color: theme.secondaryDark }}>console.anthropic.com</a>.
              Cost is roughly ₹1 per article generated. Anyone opening this URL on a different device/browser will need to enter it once too.
            </p>
            <div style={{ display: "flex", gap: "8px" }}>
              <input
                type="password"
                value={keyInput}
                onChange={(e) => setKeyInput(e.target.value)}
                placeholder={apiKey ? "•••••••••••••••••••• (saved)" : "sk-ant-..."}
                style={{ flex: 1, padding: "8px 10px", border: `1px solid ${HAIRLINE}`, borderRadius: "3px", fontSize: "13px" }}
              />
              <button onClick={saveKey} style={{ padding: "8px 14px", background: INK, color: PAPER, border: "none", borderRadius: "3px", fontSize: "12.5px", fontWeight: 600, cursor: "pointer" }}>Save</button>
              {apiKey && (
                <button onClick={clearKey} style={{ padding: "8px 14px", background: "#fff", color: PRESSRED, border: `1px solid ${HAIRLINE}`, borderRadius: "3px", fontSize: "12.5px", fontWeight: 600, cursor: "pointer" }}>Remove</button>
              )}
            </div>
          </div>
        )}

        <div style={{ display: "flex", gap: "14px", marginBottom: "22px", flexWrap: "wrap" }}>
          {Object.keys(THEMES).map((pub) => (
            <PublicationCard
              key={pub}
              pub={pub}
              theme={THEMES[pub]}
              active={publication === pub}
              onSelect={setPublication}
            />
          ))}
        </div>

        <textarea
          value={sourceText}
          onChange={(e) => setSourceText(e.target.value)}
          placeholder="Paste your article, press release, or event recap here..."
          rows={8}
          style={{ width: "100%", padding: "14px", border: `1px solid ${HAIRLINE}`, borderRadius: "4px", fontSize: "13.5px", fontFamily: "'Inter', sans-serif", resize: "vertical", outline: "none", marginBottom: "6px", background: "#fff", transition: "border-color 200ms ease" }}
          onFocus={(e) => { e.target.style.borderColor = theme.secondary; }}
          onBlur={(e) => { e.target.style.borderColor = HAIRLINE; }}
        />
        <div style={{ display: "flex", justifyContent: "space-between", fontFamily: "'JetBrains Mono', monospace", fontSize: "10.5px", color: "#9A9280", marginBottom: "16px", letterSpacing: "0.03em" }}>
          <span>words filed: {wordCount}</span>
          <span>desk: {theme.name.toLowerCase()}</span>
        </div>

        <button
          className="gen-btn"
          onClick={generate}
          disabled={loading || !sourceText.trim()}
          style={{
            display: "inline-flex", alignItems: "center", gap: "8px",
            background: loading || !sourceText.trim() ? "#C4BCA6" : theme.secondary,
            color: PAPER, border: "none", padding: "12px 22px", borderRadius: "3px",
            fontSize: "13.5px", fontWeight: 600,
            cursor: loading || !sourceText.trim() ? "not-allowed" : "pointer",
            marginBottom: "24px", transition: "background 260ms ease",
          }}
        >
          {loading ? <LoaderIcon size={16} /> : <SparklesIcon size={16} />}
          {loading ? "Filing copy..." : "Generate content"}
        </button>

        {error && (
          <div style={{ display: "flex", alignItems: "center", gap: "8px", color: PRESSRED, fontSize: "13px", marginBottom: "20px" }}>
            <AlertIcon size={15} /> {error}
          </div>
        )}

        {results && (
          <div style={{ display: "flex", flexDirection: "column", gap: "14px" }}>
            {FORMATS.map((f, i) => (
              <div
                key={f.key}
                className="result-card"
                style={{
                  background: "#fff", border: `1px solid ${HAIRLINE}`, borderTop: `3px solid ${theme.secondary}`,
                  borderRadius: "2px", padding: "16px 18px", animationDelay: `${i * 70}ms`,
                }}
              >
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "8px" }}>
                  <div>
                    <div style={{ fontWeight: 600, fontSize: "14px" }}>{f.label}</div>
                    <div style={{ fontSize: "11.5px", color: "#9A9280" }}>{f.desc}</div>
                  </div>
                  <button
                    onClick={() => copyText(f.key, results[f.key] || "")}
                    style={{
                      display: "inline-flex", alignItems: "center", gap: "5px", fontSize: "12px", padding: "6px 10px",
                      borderRadius: "3px", border: `1px solid ${HAIRLINE}`,
                      background: copiedKey === f.key ? theme.secondaryTint : "#fff",
                      color: copiedKey === f.key ? theme.secondaryDark : INK, cursor: "pointer",
                      transition: "background 180ms ease, color 180ms ease",
                    }}
                  >
                    {copiedKey === f.key ? <CheckIcon size={13} /> : <CopyIcon size={13} />}
                    {copiedKey === f.key ? "Copied" : "Copy"}
                  </button>
                </div>
                <p style={{ fontSize: "13.5px", lineHeight: 1.6, whiteSpace: "pre-wrap", margin: 0, color: "#3A3630" }}>
                  {results[f.key] || "—"}
                </p>
              </div>
            ))}
          </div>
        )}

        {!results && !loading && !error && (
          <div style={{ border: `1px dashed ${HAIRLINE}`, borderRadius: "4px", padding: "32px", textAlign: "center", color: "#9A9280", fontSize: "13px" }}>
            Paste your content above and click Generate — four ready-to-post versions will appear here.
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ContentRepurposer />);
</script>
</body>
</html>
